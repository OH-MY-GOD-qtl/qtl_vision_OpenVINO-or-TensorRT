# 全向感知配置：3×USB 传统检测（方位搜索） + 1×海康 YOLO（精确主瞄准）
# 海康优先：海康有目标 -> 由精确链路(planner)输出；无海康 -> USB 引导 yaw + pitch 预设
# 基于 standard1.yaml，新增 USB 相机段与 omni 段。
# 无硬件调试：把 simulate 改为 true（不打开串口，固定自瞄模式）。

enemy_color: "blue"
# enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/0526.onnx
# WSL 本机：使用 TensorRT 引擎推理（机器人端 CPU 部署请置为 false）
use_tensorrt: true
yolov5_engine_path: assets/yolov5.engine
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数（USB 全向搜索用，仅灯条几何、不识别编号）-----#####
color_threshold: 40   # 颜色差阈值（分离通道：红敌R-B / 蓝敌B-R）
brightness_threshold: 100 # 亮度阈值（灰度）
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----USB相机参数（3 路全向搜索）-----#####
image_width: 640
image_height: 360
usb_frame_rate: 60
usb_exposure: 320
usb_gamma: 160
usb_gain: 10

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -1 # degree -2.5
pitch_offset: -6 # degree 2

# 距离相关的偏移量补偿，格式为：[[距离1, yaw偏移1, pitch偏移1], ...]
distance_offsets:
  - [0.5, -1, -6]
  - [1, -1.5, -7]
  - [1.5, -2, -8]
  - [2, -2.5, -9]
  - [2.5, -3, -10]

# 小陀螺补偿参数
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.050 # s   # 整链路延迟补偿：实测标定
low_speed_delay_time: 0.050 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----海康相机参数（精确主瞄准）-----#####
camera_name: "hikrobot"
exposure_ms: 5
gain: 16
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.4563px (3ms)
camera_matrix: [2410.1177828866184, 0, 696.97081147817175, 0, 2409.3786200699446, 536.84951734177901, 0, 0, 1]
distort_coeffs: [-0.032239346234435903, 0.1627898520892295, -0.00047429972386579534, -0.00022362006023353905, 0]

# 相机同理想情况的偏角: yaw-0.56 pitch0.42 roll-1.81 degree
R_camera2gimbal: [0.0094525557562965545, 0.0076755468600450648, 0.9999258648370255, -0.99945398638704219, -0.031588319629946904, 0.0096905705717549463, 0.03166035825324711, -0.99947149236151578, 0.0073727655544226778]
t_camera2gimbal: [0.13896449776991429, 0.0016645156598860274, 0.045653029822075177]

#####-----decider参数-----#####
mode: 1

#####-----全向感知(omni)参数-----#####
omni_usb_devices: ["video0", "video2", "video4"]  # /dev/ 名，顺序对应 usb0/usb1/usb2
omni_usb_yaw_offsets: [60, -60, -180]             # 三路USB相对yaw零位的安装角(degree)
omni_usb_fov_h: 37.0                              # USB水平FOV(degree)
omni_usb_fov_v: 40.9                              # USB垂直FOV(degree)
omni_hik_yaw_offset: 0                            # 海康相对yaw零位安装角(degree)
omni_hik_fov_h: 54.2                              # 海康水平FOV(degree)
omni_hik_fov_v: 44.5                              # 海康垂直FOV(degree)
omni_pitch_preset: 0                              # 无海康目标时pitch预设(degree)
omni_usb_max_age_s: 0.15                          # USB结果老化阈值(s)
omni_usb_yaw_rate_limit: 3.0                      # USB引导yaw限速(rad/s)
omni_usb_lpf_alpha: 0.4                           # USB引导yaw一阶低通系数(0~1)

#####-----gimbal参数-----#####
simulate: false
com_port: "/dev/ttyACM0"
baud_rate: 115200     # 波特率
debug_serial: false   # 打印串口收发原始字节（调试用）
bytesize: 8             # 数据位
parity: "none"          # 奇偶校验（none/odd/even）
stopbits: 1             # 停止位

#####-----planner-----#####
fire_thresh: 0.003
#### 成本函数：Q矩阵(状态权重)和R矩阵(控制权重)
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]
